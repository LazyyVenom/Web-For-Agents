name: Release

# Publishes to npm when a version tag (v1.2.3, v1.2.3-beta.1) is pushed.
# Uses npm trusted publishing (OIDC): there is no NPM_TOKEN. Provenance is generated automatically.
# Three jobs: `verify` runs all dependency code with no publish rights; `publish` holds id-token: write
# but installs nothing and only publishes the tarball built by `verify`; `github-release` has
# contents: write only and creates the GitHub Release from the CHANGELOG section.
# A tag on a commit whose message contains "[skip ci]" does not trigger the push event;
# release it with "Run workflow" on the tag (gh workflow run release.yml --ref v1.2.3).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Never run on forks.
    if: github.repository == 'LazyyVenom/Web-For-Agents'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WFA_CHROME: require
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:pack
      - name: Check the tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Run the release on a version tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      # prepare builds git installs; the registry package does not need it, and npm 11 warns about
      # install scripts on every install. dist/ is already built above.
      - name: Pack
        run: |
          npm pkg delete scripts.prepare
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.repository == 'LazyyVenom/Web-For-Agents'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1. Pinned on purpose; update it deliberately.
      - run: npm install -g npm@12.2.1
      # Staged publish: the version stays private until a maintainer approves it with 2FA
      # (npm stage approve <id>, or on npmjs.com). Allowed by the trusted publisher by default.
      - name: Stage publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; else tag=latest; fi
          files=("$RUNNER_TEMP"/package/*.tgz)
          [ "${#files[@]}" -eq 1 ] || { echo "Expected exactly one tarball" >&2; exit 1; }
          npm stage publish "${files[0]}" --provenance --access public --tag "$tag" --ignore-scripts

  # The npm version is only staged at this point and goes live after `npm stage approve`;
  # the GitHub Release is created now so the changelog notes are published with the tag.
  github-release:
    needs: publish
    if: github.repository == 'LazyyVenom/Web-For-Agents'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $1 == "##" { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md section for $version" >&2; exit 1; }
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${flags[@]}"
