name: Release

# Publishes to npm when a version tag (v1.2.3, v1.2.3-beta.1) is pushed.
# Uses npm trusted publishing (OIDC): there is no NPM_TOKEN. Provenance is generated automatically.
# Two jobs: `verify` runs all dependency code with no publish rights; `publish` holds id-token: write
# but installs nothing and only publishes the tarball built by `verify`.
# A tag on a commit whose message contains "[skip ci]" does not trigger the push event;
# release it with "Run workflow" on the tag (gh workflow run release.yml --ref v1.2.3).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Never run on forks.
    if: github.repository == 'LazyyVenom/Web-For-Agents'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WFA_CHROME: require
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:pack
      - name: Check the tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Run the release on a version tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      # prepare builds git installs; the registry package does not need it, and npm 11 warns about
      # install scripts on every install. dist/ is already built above.
      - name: Pack
        run: |
          npm pkg delete scripts.prepare
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.repository == 'LazyyVenom/Web-For-Agents'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
          path: ${{ runner.temp }}/package
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1. Pinned on purpose; update it deliberately.
      - run: npm install -g npm@12.2.1
      # Staged publish: the version stays private until a maintainer approves it with 2FA
      # (npm stage approve <id>, or on npmjs.com). Allowed by the trusted publisher by default.
      - name: Stage publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; else tag=latest; fi
          files=("$RUNNER_TEMP"/package/*.tgz)
          [ "${#files[@]}" -eq 1 ] || { echo "Expected exactly one tarball" >&2; exit 1; }
          npm stage publish "${files[0]}" --provenance --access public --tag "$tag" --ignore-scripts
