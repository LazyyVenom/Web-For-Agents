name: Release

# Publishes to npm when a version tag (v1.2.3, v1.2.3-beta.1) is pushed.
# Uses npm trusted publishing (OIDC): there is no NPM_TOKEN. Provenance is generated automatically.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  publish:
    # Never run on forks.
    if: github.repository == 'LazyyVenom/Web-For-Agents'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      WFA_CHROME: require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; else tag=latest; fi
          npm publish --provenance --access public --tag "$tag"
